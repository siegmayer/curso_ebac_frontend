<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms A e B</title>
    <link rel="stylesheet" href="./main.css">
    <script src="./java.js"></script>
</head>
<body>
    <div class="container">
        <h1>
            Para prosseguir o campo B deve ser maior que A:            
        </h1>
        <div class="forms">
        <form>
            <label for="texto-a">Campo A :</label>
            <input id="texto-a" type="text" required placeholder="Insira um numero">
            <br>
            <label for="texto-b">Campo B :</label>
            <input id="texto-b" type="text" required placeholder="Insira um numero">
            <button type="submit" onclick="mostrarAlert()">Comparar</button>
        </form>
    </div>
    </div>
</body>
</html>
